name: Deploy to dev env on merge
on:
  push:
    branches:
      - dev
env:
  REGISTRY: registry.yala.events
  REGISTRY_USER: ${{ secrets.REGISTRY_DEV_USER }}
  REGISTRY_PWD: ${{ secrets.REGISTRY_DEV_PWD }}

  IMAGE_NAME: help-desk-front
  IMAGE_TAG: dev.0.1.0
  NAMESPACE: dev
  CONTAINER_PORT: 3888

  ENVS: ${{ secrets.ENVS_DEV_JSON }}

jobs:
  docker_build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PWD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{env.IMAGE_TAG}}

  deploy:
    runs-on: ubuntu-latest
    needs: docker_build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch deployment templates
        uses: actions/checkout@v2
        with:
          repository: YALA-Events/yala-events-kube-configs
          ref: ${{env.NAMESPACE}}
          path: yala-events-kube-configs
          token: ${{secrets.PAT_YE_KUBE_CONFIGS}}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Create .kube directory
        run: mkdir -p $HOME/.kube

      - name: Set up kubeconfig
        run: echo "${{secrets.KUBECONFIG}}" > $HOME/.kube/config

      - name: Install Jinja2
        run: pip install jinja2

      - name: Render deployment template
        run: python yala-events-kube-configs/templates/template_builder.py yala-events-kube-configs/templates/deployment.j2 IMAGE_NAME,IMAGE_TAG,NAMESPACE,REGISTRY,CONTAINER_PORT,ENVS > deployment.yaml

      - name: Render service template
        run: python yala-events-kube-configs/templates/template_builder.py yala-events-kube-configs/templates/service.j2 IMAGE_NAME,IMAGE_TAG,NAMESPACE,CONTAINER_PORT > service.yaml

      - name: Apply service
        run: kubectl apply -f service.yaml

      - name: Apply deployment
        run: kubectl apply -f deployment.yaml
